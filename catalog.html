<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Каталог | NATHELF</title>

<meta name="description" content="Каталог продукции NATHELF: Abifol, AgnaBella, Estabel, Bellafemina, Sefe, Natmasto, Serpuro, Justferton.">
<link rel="canonical" href="https://nathelf.uz/catalog.html">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
--ink:#0b0f14;
--ease:cubic-bezier(.22,1,.36,1);
--gutter:3.2vw;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:'Inter Tight',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
background:#fff;
color:var(--ink);
overflow-x:hidden;
-webkit-font-smoothing:antialiased;
transition:background-color .6s ease;
}
img{display:block;max-width:100%}

/* ---------- Navigation (light) ---------- */
.nav{
position:fixed;top:0;left:0;right:0;z-index:50;
display:flex;align-items:center;justify-content:space-between;
padding:18px var(--gutter);
}
.nav-logo img{height:40px;width:auto}
.nav-pill{
position:absolute;left:50%;transform:translateX(-50%);
display:flex;gap:2px;padding:4px;border-radius:999px;
background:rgba(11,15,20,.05);
border:1px solid rgba(11,15,20,.07);
-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
}
.nav-pill a{
font-size:13px;font-weight:500;text-decoration:none;
padding:7px 15px;border-radius:999px;
color:rgba(11,15,20,.6);
transition:color .3s,background .3s;
}
.nav-pill a:hover{color:var(--ink)}
.nav-pill a.is-active{background:var(--ink);color:#fff}
.nav-cta{
font-size:13px;font-weight:600;text-decoration:none;
padding:10px 18px;border-radius:999px;
background:var(--ink);color:#fff;
transition:transform .35s var(--ease);
}
.nav-cta:hover{transform:translateY(-1px)}

/* ---------- Title ---------- */
.char{display:inline-block;will-change:transform,opacity}
.gradient{
background:linear-gradient(90deg,#00d67d,#ff4fd1,#00d67d);
background-size:200% auto;
-webkit-background-clip:text;background-clip:text;
-webkit-text-fill-color:transparent;
animation:shimmer 6s linear infinite;
}
.gradient .char{
background-image:linear-gradient(90deg,#00d67d,#ff4fd1,#00d67d);background-size:200% auto;
-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
animation:shimmer 6s linear infinite;
}
@keyframes shimmer{to{background-position:-200% center}}
.section-title{
text-align:center;
font-size:clamp(2.2rem,4.5vw,3.6rem);
font-weight:500;letter-spacing:-.035em;
margin-bottom:20px;perspective:600px;
}

/* ---------- Product carousel ---------- */
.btn{
display:inline-block;padding:14px 28px;border-radius:50px;
text-decoration:none;color:#fff;font-weight:600;
background:linear-gradient(90deg,#00d67d,#ff4fd1);
box-shadow:0 15px 35px rgba(255,79,209,.25);
transition:transform .3s ease,box-shadow .3s ease;
}
.btn:hover{transform:translateY(-4px) scale(1.03);box-shadow:0 20px 45px rgba(255,79,209,.4)}
.carousel-section{
min-height:100vh;min-height:100svh;
padding:100px 0 40px;overflow:hidden;
display:flex;flex-direction:column;
}
/* auto margins center the block but collapse to 0 instead of pushing it under the nav on short screens */
.catalog-inner{margin:auto 0;width:100%}
.carousel{
position:relative;display:flex;align-items:center;gap:16px;
width:100%;max-width:1000px;margin:0 auto;padding:0 8%;
}
.car-viewport{overflow:hidden;width:100%;border-radius:40px}
.car-track{display:flex;transition:transform .6s cubic-bezier(.65,0,.35,1)}
.car-slide{
flex:0 0 100%;
display:flex;flex-direction:column;align-items:center;
text-align:center;padding:24px 20px;
}
.car-slide img{
width:100%;max-width:280px;height:clamp(220px,36vh,360px);
object-fit:contain;margin-bottom:25px;
filter:drop-shadow(0 20px 35px rgba(0,0,0,.15));
transition:transform .4s ease;
}
.car-slide:hover img{transform:scale(1.05) translateY(-6px)}
.car-slide h3{font-size:2rem;font-weight:600;letter-spacing:-.02em;margin-bottom:22px}
.car-arrow{
flex:0 0 auto;width:52px;height:52px;border-radius:50%;
border:none;background:#fff;color:var(--ink);
box-shadow:0 10px 25px rgba(0,0,0,.12);
font-size:1.6rem;cursor:pointer;
display:flex;align-items:center;justify-content:center;
z-index:2;transition:transform .3s ease,box-shadow .3s ease;
}
.car-arrow:hover{transform:scale(1.1);box-shadow:0 15px 35px rgba(0,0,0,.18)}
.car-dots{display:flex;justify-content:center;gap:10px;margin-top:16px}
.car-dot{
width:10px;height:10px;border-radius:50%;
background:#d1d5db;border:none;cursor:pointer;
transition:.3s;padding:0;
}
.car-dot.active{background:linear-gradient(90deg,#00d67d,#ff4fd1);width:28px;border-radius:6px}

@media(max-width:760px){
:root{--gutter:5vw}
.nav-pill{display:none}
.nav-logo img{height:32px}
.car-arrow{width:40px;height:40px;font-size:1.2rem}
.car-slide{padding:20px 10px}
}
@media(prefers-reduced-motion:reduce){
*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>

<body>

<header class="nav">
<a class="nav-logo" href="index.html" aria-label="NATHELF — на главную"><img src="logo.png" alt="NATHELF"></a>
<nav class="nav-pill" aria-label="Основное меню">
<a href="index.html">Главная</a>
<a href="index.html#serpuro">SerPuro</a>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<script>
// Product carousel: navigating also tints the page background to the product's color.
(function(){
  const track=document.getElementById('carTrack');
  const dotsWrap=document.getElementById('carDots');
  const slides=Array.from(track.children);
  let carIndex=0;
  slides.forEach((_,i)=>{
    const dot=document.createElement('button');
    dot.className='car-dot'+(i===0?' active':'');
    dot.setAttribute('aria-label','Слайд '+(i+1));
    dot.addEventListener('click',()=>goToSlide(i));
    dotsWrap.appendChild(dot);
  });
  function goToSlide(i){
    carIndex=(i+slides.length)%slides.length;
    track.style.transform='translateX(-'+(carIndex*100)+'%)';
    dotsWrap.querySelectorAll('.car-dot').forEach((d,di)=>d.classList.toggle('active',di===carIndex));
    const color=slides[carIndex].dataset.color;
    if(color) document.body.style.backgroundColor=color;
  }
  document.querySelector('.car-prev').addEventListener('click',()=>goToSlide(carIndex-1));
  document.querySelector('.car-next').addEventListener('click',()=>goToSlide(carIndex+1));
})();

// Title assembles letter by letter (grouped per word so words never break mid-word).
if(window.gsap && !matchMedia('(prefers-reduced-motion: reduce)').matches){
  const title=document.querySelector('.kinetic');
  const text=title.textContent;
  title.textContent='';
  title.setAttribute('aria-label',text);
  text.split(' ').forEach((word,wi,words)=>{
    const wordSpan=document.createElement('span');
    wordSpan.style.display='inline-block';
    wordSpan.style.whiteSpace='nowrap';
    [...word].forEach(ch=>{
      const span=document.createElement('span');
      span.className='char';
      span.textContent=ch;
      wordSpan.appendChild(span);
    });
    title.appendChild(wordSpan);
    if(wi<words.length-1) title.appendChild(document.createTextNode(' '));
  });
  gsap.timeline({delay:.1})
    .from('.nav',{y:-30,opacity:0,duration:.9,ease:'expo.out'},0)
    .from(title.querySelectorAll('.char'),{
      y:50,opacity:0,rotateX:-90,transformOrigin:'50% 100%',
      duration:.6,ease:'back.out(1.6)',stagger:.02
    },.1)
    .from('.carousel',{y:60,opacity:0,duration:.8,ease:'power3.out'},.3)
    .from('.car-dots',{opacity:0,duration:.6},.6);
}
</script>
